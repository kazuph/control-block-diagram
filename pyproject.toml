[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "control-block-diagram"
version = "0.0.1"
authors = [
  { name="Felix Book", email="64723297+fbook98@users.noreply.github.com" },
]
description = "Python Toolbox to draw Control Block Diagrams"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.1.2",
    "numpy>=1.16.4",
    "pylatex>=1.4.1",
    "pillow>=9.0.0",
    "pymupdf>=1.23.0",
]

[project.urls]
"Homepage" = "https://github.com/upb-lea/control-block-diagram"
"Bug Tracker" = "https://github.com/upb-lea/control-block-diagram/issues"
